<app-athlete-nav-bar></app-athlete-nav-bar>

<div class="booking-container">

  <div class="search-card">
    <p class="search-title">Search facilities</p>
    <div class="search-row">
      <input type="text" [(ngModel)]="searchParams.name" placeholder="Facility name" />
      <select [(ngModel)]="searchParams.city">
        <option value="">City</option>
        @for(city of cities; track city){
          <option [value]="city">{{city}}</option>
        }
      </select>
      <select [(ngModel)]="searchParams.sport">
        <option value="">Sport</option>
        @for(sport of sports; track sport){
          <option [value]="sport">{{sport}}</option>
        }
      </select>
      <select [(ngModel)]="searchParams.type">
        <option value="">Court type</option>
        <option value="OPEN">Open</option>
        <option value="CLOSED">Closed</option>
      </select>
    </div>

    <div class="search-footer">
      <label class="checkbox-label">
        <input type="checkbox" [(ngModel)]="searchParams.onlyFreeToday" />
        Only show free slots available today
      </label>
      <button (click)="search()">Search</button>
    </div>
  </div>

  <span class="error-msg" *ngIf="message">{{message}}</span>

  @if(facilities.length > 0){
    <table class="results-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>City</th>
          <th>Sport</th>
          <th>Type</th>
          <th>Price/h</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        @for(f of facilities; track f.id){
          <tr>
            <td>{{f.name}}</td>
            <td>{{f.city}}</td>
            <td>{{f.sports}}</td>
            <td>{{f.type}}</td>
            <td>{{f.pricePerHour}} RSD</td>
            <td><button (click)="goToDetails(f.id)">Details</button></td>
          </tr>
        }
      </tbody>
    </table>
  }

</div>
