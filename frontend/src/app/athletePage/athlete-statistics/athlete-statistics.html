<app-athlete-nav-bar></app-athlete-nav-bar>

<div class="dashboard-container">
  <div class="header-section">
    <h2>My Statistics & Activity</h2>
    <p class="text-muted">An overview of your reservations, monthly activity, and equipment spending.</p>
  </div>

  <div class="metrics-section">
    <div class="metric-card">
      <div class="metric-icon">💶</div>
      <div class="metric-details">
        <span class="metric-label">Your Total Equipment Spending</span>
        <h3 class="metric-value">{{ totalSpending }} RSD</h3>
        <span class="metric-status">Order Status: Picked Up</span>
      </div>
    </div>
  </div>

  <div class="charts-grid">
    
    <div class="chart-card">
      <div class="chart-header">
        <h4>Number of Reservations per Sport</h4>
      </div>
      <div class="chart-body">
        <canvas #barCanvas></canvas>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-header">
        <h4>Monthly Activity Overview</h4>
      </div>
      <div class="chart-body">
        <canvas #lineCanvas></canvas>
      </div>
    </div>

  </div>
</div>
