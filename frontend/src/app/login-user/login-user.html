<div class="login-container">
  <div class="login-card">

    <div class="login-header">
      <span class="login-logo">⚽</span>
      <h2>SportSphere Hub</h2>
      <p>Sign in to your account</p>
    </div>

    <hr class="divider" />

    <form>
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" [(ngModel)]="username" placeholder="username" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" [(ngModel)]="password" placeholder="password" />
      </div>

      <div class="form-group">
        <label>Account type</label>
        <div class="role-selector">
          <div class="role-card" [class.selected]="type === 'athlete'" (click)="type = 'athlete'">
            <span class="role-icon">🏃</span>
            <p class="role-title">Athlete</p>
          </div>
          <div class="role-card" [class.selected]="type === 'worker'" (click)="type = 'worker'">
            <span class="role-icon">💼</span>
            <p class="role-title">Employee</p>
          </div>
        </div>
      </div>

      <span class="error-msg" *ngIf="message">{{ message }}</span>

      <button type="button" (click)="login()">Login</button>

      <div class="bottom-links">
        <a routerLink="/forgottenPassword">Forgot your password?</a>
        <p>Don't have an account? <a routerLink="/register">Register</a></p>

        <p style="margin-top: 15px;"><a routerLink="">← Back to Home</a></p>
      </div>
    </form>

  </div>
</div>
