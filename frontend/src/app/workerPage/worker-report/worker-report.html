<app-worker-nav-bar></app-worker-nav-bar>
<div class="report-card">
  <h3>Reports</h3>

  <div class="report-section">
    <h4>Court Occupancy</h4>
    <div class="report-controls">
      <div class="field">
        <label>Facility:</label>
        <select [(ngModel)]="selectedFacility">
          @for (f of facilities; track f.id) {
            <option [ngValue]="f">{{f.name}}</option>
          }
        </select>
      </div>
      <div class="field">
        <label>Month:</label>
        <input type="month" [(ngModel)]="selectedMonth">
      </div>
      <button class="primary-btn" (click)="downloadOccupancy()" [disabled]="loadingOccupancy">
        {{loadingOccupancy ? 'Generating...' : 'Download PDF'}}
      </button>
    </div>
  </div>

  <div class="report-section">
    <h4>Equipment Turnover</h4>
    <div class="report-controls">
      <div class="field">
        <label>Month:</label>
        <input type="month" [(ngModel)]="selectedMonth">
      </div>
      <button class="primary-btn" (click)="downloadEquipment()" [disabled]="loadingEquipment">
        {{loadingEquipment ? 'Generating...' : 'Download PDF'}}
      </button>
    </div>
  </div>

  <span class="message" *ngIf="message">{{message}}</span>
</div>
