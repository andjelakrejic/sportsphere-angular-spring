<app-admin-nav-bar></app-admin-nav-bar>

<div class="sports-container">
  <h2>Sports</h2>

  <div class="add-sport-card">
    <h4>Add New Sport</h4>
    <div class="add-sport-row">
      <input type="text" [(ngModel)]="newSportName" placeholder="Sport name" />
      <button class="primary-btn" (click)="addSport()">Add Sport</button>
    </div>
    @if (message) {
      <div [class.success-msg]="message.success" [class.error-msg]="!message.success">
        {{message.message}}
      </div>
    }
  </div>

  <div class="table-wrapper">
    <table class="styled-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
        </tr>
      </thead>
      <tbody>
        @for (s of sports; track s.id) {
          <tr>
            <td>{{s.id}}</td>
            <td>{{s.name}}</td>
          </tr>
        }
      </tbody>
    </table>

    @if (sports.length === 0) {
      <p class="empty-msg">No sports found.</p>
    }
  </div>
</div>
